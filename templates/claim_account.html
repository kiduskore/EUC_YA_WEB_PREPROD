{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-[#0b1437] text-white">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-[#0075ff] rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>

    <div class="w-full max-w-md p-8 relative z-10 text-center" style="background: #111c44; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1.25rem;">
        <h2 class="text-2xl font-bold mb-2">Join Dashboard</h2>
        <p class="text-gray-400 text-sm mb-8">Enter your invite code to create your account.</p>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 rounded-xl p-3 text-sm mb-6">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/claim-account" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Invite Code</label>
                <input type="text" name="invite_code" required class="w-full bg-slate-800/60 border border-white/10 text-white rounded-xl p-4 outline-none focus:border-[#0075ff]" placeholder="e.g. EUCleader26 or ABCD12">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Full Name</label>
                <input type="text" name="full_name" required class="w-full bg-slate-800/60 border border-white/10 text-white rounded-xl p-4 outline-none focus:border-[#0075ff]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Email Address</label>
                <input type="email" name="email" autocapitalize="none" autocorrect="off" autocomplete="email" required class="w-full bg-slate-800/60 border border-white/10 text-white rounded-xl p-4 outline-none focus:border-[#0075ff]">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">New Password</label>
                <input type="password" name="password" autocomplete="new-password" required class="w-full bg-slate-800/60 border border-white/10 text-white rounded-xl p-4 outline-none focus:border-[#0075ff]">
            </div>
            <button type="submit" class="w-full bg-[#0075ff] text-white font-bold rounded-xl p-4 mt-4">Create Account</button>
        </form>
        <div class="mt-8">
            <a href="/login" class="text-xs text-gray-500 hover:text-white transition-colors">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
